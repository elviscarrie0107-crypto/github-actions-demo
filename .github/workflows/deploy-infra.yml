name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          echo "AWS_ROLE_ARN is set: ${{ secrets.AWS_ROLE_ARN != '' }}"
          echo "AWS_REGION is set: ${{ secrets.AWS_REGION != '' }}"
          echo "Role ARN length: ${#AWS_ROLE_ARN}"
          echo "Region length: ${#AWS_REGION}"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Verify AWS Access
        run: |
          echo "🔍 Verifying AWS access..."
          aws sts get-caller-identity
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Account ID: $ACCOUNT_ID"

      # - name: Write terraform.tfvars for environment
      #   run: |
      #     cat << 'EOF' > tf/configure-aws-credentials/environments/$ENVIRONMENT/terraform.tfvars
      #     ${{ secrets.TFVARS }}
      #     EOF

      - name: Check Terraform Backend Infra
        run: |
          # Check if backend infrastructure exists
          echo "🔍 Checking S3 backend infrastructure..."
          BUCKET_NAME="github-test-terraform-state-$ENVIRONMENT"
          TABLE_NAME="github-test-terraform-lock-$ENVIRONMENT"

          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
              echo "⚠️  S3 backend bucket not found: $BUCKET_NAME"
              echo "🔧 Creating S3 bucket..."
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" --create-bucket-configuration LocationConstraint="$AWS_REGION"
              aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
              aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
              aws s3api put-bucket-policy --bucket "$BUCKET_NAME" --policy '{"Version":"2012-10-17","Statement":[{"Sid":"DenyInsecureTransport","Effect":"Deny","Principal":"*","Action":"s3:*","Resource":["arn:aws:s3:::'"$BUCKET_NAME"'","arn:aws:s3:::'"$BUCKET_NAME"'/*"],"Condition":{"Bool":{"aws:SecureTransport":"false"}}}]}'
              echo "✅ S3 bucket created: $BUCKET_NAME"
          fi

          if ! aws dynamodb describe-table --table-name "$TABLE_NAME" --region "$AWS_REGION" 2>/dev/null; then
              echo "⚠️  DynamoDB state lock table not found: $TABLE_NAME"
              echo "🔧 Creating DynamoDB table..."
              aws dynamodb create-table \
                  --table-name "$TABLE_NAME" \
                  --attribute-definitions AttributeName=LockID,AttributeType=S \
                  --key-schema AttributeName=LockID,KeyType=HASH \
                  --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
                  --region "$AWS_REGION"
              echo "⏳ Waiting for DynamoDB table to be active..."
              aws dynamodb wait table-exists --table-name "$TABLE_NAME" --region "$AWS_REGION"
              echo "✅ DynamoDB table created: $TABLE_NAME"
          fi

          echo "✅ S3 backend infrastructure verified"

      - name: Terraform Init
        run: |
          cd tf/configure-aws-credentials
          echo "🔧 Initializing Terraform with S3 backend..."
          terraform init -backend-config="environments/$ENVIRONMENT/backend.tf"

      - name: Validate Terraform Configuration
        run: |
          # Validate Terraform configuration
          echo "🔍 Validating Terraform configuration..."
          terraform validate

      - name: Terraform Plan
        run: |
          cd tf/configure-aws-credentials
          terraform plan -out="$ENVIRONMENT.tfplan"
        env:
          TF_VAR_github_repo: ${{ secrets.REPO_NAME }}

      - name: Terraform Apply
        run: |
          cd tf/configure-aws-credentials
          terraform apply -auto-approve "$ENVIRONMENT.tfplan"
          echo "✅ Deployment completed for ${{ github.event.inputs.environment }}"
